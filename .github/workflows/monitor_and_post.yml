name: Monitor and Post

on:
  schedule:
    - cron: '10 6 * * *'   # 09:10 МСК (UTC+3)
    - cron: '30 8 * * *'   # 11:30 МСК
    - cron: '10 10 * * *'  # 13:10 МСК (юмор)
    - cron: '30 12 * * *'  # 15:30 МСК
    - cron: '10 14 * * *'  # 17:10 МСК
    - cron: '30 16 * * *'  # 19:30 МСК (юмор)
    - cron: '10 17 * * *'  # 20:10 МСК (саммари)
  workflow_dispatch:       # Ручной запуск для тестирования

permissions:
  contents: write          # Нужно для git commit + push результатов

jobs:
  monitor-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Получаем полную историю, чтобы корректно пушить
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor (collect sources -> generate posts)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=== Запуск мониторинга источников ==="
          python scripts/monitor.py

      - name: Commit generated posts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # articles_cache.json — временный кэш, не нужен в git
          git rm --cached posts/articles_cache.json 2>/dev/null || true
          # articles_pool.json коммитим — это состояние системы между запусками
          git add posts/ -- ':!posts/articles_cache.json'
          if git diff --staged --quiet; then
            echo "Новых файлов нет — коммит не нужен"
          else
            git commit -m "Auto: posts $(date +'%Y-%m-%d %H:%M UTC')"
            # -X theirs: при rebase-конфликте предпочитаем наши локальные изменения
            git pull --rebase --autostash -X theirs
            git push
          fi

      - name: Post to Telegram channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          echo "=== Публикация постов в Telegram ==="
          python scripts/poster.py

      - name: Commit post results (_posted files)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Подтягиваем возможные изменения от предыдущего шага
          git pull --rebase --autostash -X theirs
          git add posts/ -- ':!posts/articles_cache.json'
          if git diff --staged --quiet; then
            echo "Новых изменений после постинга нет"
          else
            git commit -m "Auto: mark posted $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Notify owner via Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'EOF'
          import os, glob, re, requests

          bot_token = os.environ["BOT_TOKEN"]
          owner_id = 8118456427

          md_files = [f for f in glob.glob("posts/*.md") + glob.glob("posts/*_posted.md")
                      if ".gitkeep" not in f]

          if not md_files:
              text = "⚠️ Мониторинг завершён — файл результата не найден."
          else:
              latest = max(md_files, key=os.path.getmtime)
              content = open(latest, encoding="utf-8").read()
              count_m = re.search(r"Найдено релевантных материалов: (\d+)", content)
              src_m   = re.search(r"Проверено источников: (\d+)", content)
              count   = count_m.group(1) if count_m else "?"
              sources = src_m.group(1)   if src_m   else "?"
              if count == "0":
                  text = f"📭 Новых материалов нет. Проверено источников: {sources}."
              else:
                  text = f"✅ Опубликовано постов: {count}. Источников: {sources}."

          requests.post(
              f"https://api.telegram.org/bot{bot_token}/sendMessage",
              json={"chat_id": owner_id, "text": text},
              timeout=10,
          )
          print(f"Уведомление отправлено: {text}")
          EOF
